<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cyz吃瓜网</title>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body{
  font-family: system-ui, -apple-system, sans-serif;
  background-color: #f7f8fa;
  color: #222;
  line-height: 1.6;
}
/* 头部导航 */
header{
  background-color: #2c3e50;
  color: white;
  padding:14px 20px;
}
.header-wrap{
  max-width:900px;
  margin:0 auto;
  display:flex;
  justify-content: space-between;
  align-items:center;
}
.header-wrap h1{
  font-size:20px;
}
.nav button{
  padding: 6px 12px;
  margin-left:12px;
  font-size:14px;
  cursor: pointer;
  border: none;
  border-radius:4px;
  background: #fff;
  color:#222;
}
.nav button:hover{
  background:#eee;
}
.nav a{
  text-decoration:none;
}
/* 视频标题 */
.video-title {
  text-align: center;
  margin: 40px 0 28px;
}
.video-title h2 {
  font-size: 40px;
  font-weight: 900;
  color: #111;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.video-title p {
  font-size: 30px;
  color: #555;
}
/* 左下角点赞按钮 */
#btn {
  position: fixed;
  left: 20px;
  bottom: 60px;
  padding: 8px 14px;
  font-size: 22px;
  cursor: pointer;
  border: none;
  border-radius:4px;
  background:#fff;
  box-shadow:0 2px 6px #00000022;
  z-index: 99;
}
#btn:active{
  transform: scale(0.96);
}
/* 主体容器，居中 */
.container{
  max-width:900px;
  margin:0 auto;
  padding:24px 16px;
}
/* 卡片组 */
.ad-group{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(110px,1fr));
  gap:12px;
  margin-bottom:40px;
}
.ad-card{
  background:#fff;
  padding:8px;
  border-radius:8px;
  text-align:center;
  box-shadow:0 1px 4px #00000015;
}
.ad-card img{
  width:100%;
  border-radius:6px;
  display:block;
}
/* 视频容器 */
.video-box{
  background:#000;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:32px;
}
video{
  width:100%;
  display:block;
}
/* 页脚 */
footer{
  background:#2c3e50;
  color:#bbb;
  text-align:center;
  padding:16px;
  font-size:13px;
}
</style>
</head>
<body>
<header>
  <div class="header-wrap">
    <h1>cyz吃瓜网</h1>
    <div class="nav">
      <a href="https://yandex.com/" target="_blank">
        <button>站点</button>
      </a>
      <button id="atn">关于</button>
      <button id="ctn">联系cyz</button>
    </div>
  </div>
</header>

<button id="btn">👍</button>

<div class="container">
  <div class="ad-group">
    <div class="ad-card"><img src="ad1.png"></div>
  </div>
  <div class="video-title">
    <h2>站长推荐</h2>
    <p>cyz室外露出</p>
  </div>
  <div class="video-box">
    <video controls>
      <source src="video.mp4">
    </video>
  </div>
  <div class="ad-group">
    <div class="ad-card"><img src="ad2.png"></div>
  </div>
</div>

<footer>
© 2026 cyz91吃瓜网
</footer>

<script>
const btn = document.getElementById("btn");

btn.addEventListener("click", function () {
  btn.classList.toggle("liked");

  if (btn.classList.contains("liked")) {
    btn.innerText = "❤️";
  } else {
    btn.innerText = "👍";
  }

//   alert("感谢支持！");
});

document.getElementById("atn").addEventListener("click", function () {
  alert("这是一个健康网站！");
});

document.getElementById("ctn").addEventListener("click", function () {
  alert("微信号:Cici_071122");
});
</script>
</body>
</html>
